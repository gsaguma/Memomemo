<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo Memo — Translation Memory Toolkit</title>

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp) -->
    <meta property="og:title" content="Memo Memo — Translation Memory Toolkit" />
    <meta property="og:description" content="100% client-side translation memory toolkit. TMX, XLIFF and CSV. Your files never leave your browser." />
    <meta property="og:image" content="https://memotmx.vercel.app/media/og-image.png" />
    <meta property="og:url" content="https://memotmx.vercel.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Memo Memo — Translation Memory Toolkit" />
    <meta name="twitter:description" content="100% client-side translation memory toolkit. TMX, XLIFF and CSV. Your files never leave your browser." />
    <meta name="twitter:image" content="https://memotmx.vercel.app/media/og-image.png" />
    <link class="icon" rel="icon" type="image/png" sizes="32x32" href="media/memotmx.png">
    <style>
        :root {
            --bg-surface: #ffffff;
            --bg-surface-alt: #f4f6f7;
            --text-body: #111827;
            --border-default: #E4E4E4;
            --color-primary: #1C7C85;
            --color-primary-hover: #16636a;
            --text-on-primary: #ffffff;
            --accent-mint: #D6ECE5;
            --accent-sky: #9FD4E6;

            --c-bg: #f4f8fa;
            --c-bg-alt: #eef2f4;
            --c-surface-hover: #eaf0f1;
            --c-border-light: #edf0f1;
            --c-border-hover: #d0d6d8;
            --c-text-muted: #6B7280;
            --c-text-faint: #9CA3AF;
            --c-success: #22C55E;
            --c-warning: #F59E0B;
            --c-danger: #EF4444;
        }
        .dark {
            --bg-surface: #0f172a;
            --bg-surface-alt: #1e293b;
            --text-body: #f8fafc;
            --border-default: #334155;
            --color-primary: #9FD4E6;
            --color-primary-hover: #D6ECE5;
            --text-on-primary: #0f172a;

            --c-bg: #0b1322;
            --c-bg-alt: #162032;
            --c-surface-hover: #243049;
            --c-border-light: #2a364a;
            --c-border-hover: #3d4a60;
            --c-text-muted: #CBD5E1;
            --c-text-faint: #94A3B8;
            --c-success: #22C55E;
            --c-warning: #F59E0B;
            --c-danger: #EF4444;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }
        .dark .bg-primary.text-white { color: var(--text-on-primary); }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--color-primary)',
                        'primary-hover': 'var(--color-primary-hover)',
                        surface: 'var(--bg-surface)',
                        'surface-alt': 'var(--bg-surface-alt)',
                        'surface-hover': 'var(--c-surface-hover)',
                        default: 'var(--border-default)',
                        body: 'var(--text-body)',
                        muted: 'var(--c-text-muted)',
                        faint: 'var(--c-text-faint)',
                        'bg-body': 'var(--c-bg)',
                        'bg-alt': 'var(--c-bg-alt)',
                        'border-light': 'var(--c-border-light)',
                        'border-hover': 'var(--c-border-hover)',
                        success: 'var(--c-success)',
                        warning: 'var(--c-warning)',
                        danger: 'var(--c-danger)',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-bg-body text-body min-h-screen flex flex-col font-sans transition-colors duration-200 pb-16 md:pb-0">
    <div id="mainContent">
        <div class="container mx-auto px-4 py-3 max-w-5xl">
            <div class="flex items-center justify-center gap-2 mb-3 relative">
                <h1 class="text-2xl font-bold text-primary flex items-center gap-2">
                    <img src="media/memotmx.png" alt="Memo TMX Logo" class="h-6 w-auto object-contain" />
                    <span>Memo Memo</span>
                </h1>
                <button id="darkModeToggle" type="button" aria-label="Toggle dark mode" class="absolute right-0 top-1/2 -translate-y-1/2 p-2 rounded-lg text-muted hover:bg-surface-hover focus:outline-none focus:ring-2 focus:ring-primary transition">
                    <svg id="darkModeSun" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg id="darkModeMoon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>

            <!-- Session Banner -->
            <div id="sessionBanner" class="hidden flex items-center justify-between gap-3 rounded-lg px-4 py-2.5 text-sm mb-4"></div>

            <!-- Tab Navigation -->
            <div class="flex border-b border-default mb-6 md:static fixed bottom-0 left-0 right-0 z-50 bg-surface border-t md:border-t-0 p-2 md:p-0 md:mb-6 mb-0 shadow-lg md:shadow-none justify-around md:justify-start">
                <button id="tabSearchBtn" aria-label="Search and View Translation Memory" class="flex-1 md:flex-initial py-1 md:py-2 px-2 md:px-4 text-[10px] md:text-sm font-medium border-t-2 border-b-0 md:border-t-0 md:border-b-2 border-primary text-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 dark:focus:ring-offset-bg-alt rounded-t flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    Search & View
                </button>
                <button id="tabMetaBtn" aria-label="Edit Metadata" class="flex-1 md:flex-initial py-1 md:py-2 px-2 md:px-4 text-[10px] md:text-sm font-medium border-t-2 border-b-0 md:border-t-0 md:border-b-2 border-transparent text-muted hover:text-body hover:border-default focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 dark:focus:ring-offset-bg-alt rounded-t flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                    Edit Metadata
                </button>
                <button id="tabAlignBtn" aria-label="Align Translations" class="flex-1 md:flex-initial py-1 md:py-2 px-2 md:px-4 text-[10px] md:text-sm font-medium border-t-2 border-b-0 md:border-t-0 md:border-b-2 border-transparent text-muted hover:text-body hover:border-default focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 dark:focus:ring-offset-bg-alt rounded-t flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    Align Translations
                </button>
                <button id="tabMergeBtn" aria-label="Merge Translation Memories" class="flex-1 md:flex-initial py-1 md:py-2 px-2 md:px-4 text-[10px] md:text-sm font-medium border-t-2 border-b-0 md:border-t-0 md:border-b-2 border-transparent text-muted hover:text-body hover:border-default focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 dark:focus:ring-offset-bg-alt rounded-t flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                    </svg>
                    Merge TMs
                </button>
                <button id="tabQaBtn" aria-label="Quality Check" class="flex-1 md:flex-initial py-1 md:py-2 px-2 md:px-4 text-[10px] md:text-sm font-medium border-t-2 border-b-0 md:border-t-0 md:border-b-2 border-transparent text-muted hover:text-body hover:border-default focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 dark:focus:ring-offset-bg-alt rounded-t flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    QA Check
                </button>
            </div>

            <!-- Tab Contents (Injected Dynamically via Components) -->
            <div id="tabSearchContent"></div>
            <div id="tabMetaContent" class="hidden"></div>
            <div id="tabAlignContent" class="hidden"></div>
            <div id="tabMergeContent" class="hidden"></div>
            <div id="tabQaContent" class="hidden"></div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <footer class="text-center py-4 text-sm text-muted">
        <a href="https://www.linkedin.com/in/gsaguma" target="_blank" 
           class="hover:text-primary transition-colors">
           Created with ♥ by Gabriel Saguma
        </a>
    </footer>
</body>
</html>
